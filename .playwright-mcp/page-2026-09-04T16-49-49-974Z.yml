      - text: 🌲 图形推导与考点
      - generic [ref=e101]: L2 备考
    - generic [ref=e102]: 稀缺 → 必须选择 → 选择即配置，这条逻辑链可用约束最优化表达： 1) 设资源总量为 L（如工时、晶圆），两种用途的产量为 q1、q2； 2) 资源约束：l1 + l2 ≤ L； 3) L 给定时 q1 与 q2 此消彼长：多生产 q1 必须少生产 q2（权衡取舍）； 4) 两个极端：全部资源给 q1 则 q2 = 0，反之亦然——所以任何经济都要回答「生产什么、如何生产、为谁生产」。 考点提示：稀缺性是相对于人类欲望而言的有限，不是「数量少」的绝对概念；高鸿业体系下微观经济学研究资源配置、宏观经济学研究资源利用。
    - generic [ref=e103]: 考点提示选择题常考「经济学产生于资源稀缺性与选择的需要」；简答常考「为什么说稀缺性是经济学的出发点」，答题写清三步：欲望无限 → 资源有限 → 必须选择（配置与利用）。
    - list [ref=e104]:
      - listitem [ref=e105]: ❌ 误区：稀缺 = 东西数量很少→✅ 纠正：稀缺是相对于欲望的有限；黄金若无人想要便不稀缺，空气不稀缺但被污染的洁净空气可能变稀缺
      - listitem [ref=e106]: ❌ 误区：经济学只研究花钱和赚钱→✅ 纠正：经济学研究一切稀缺条件下的选择，包括时间、注意力与环境容量
