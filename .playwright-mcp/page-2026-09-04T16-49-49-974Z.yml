    - paragraph [ref=e61]: 经济学解释芯片产能依赖有限的晶圆厂、设备与工程师，而汽车、手机、电脑的需求同时扩张——欲望超过资源即是稀缺。车企被迫回答经济学第一问：把有限的芯片优先装给哪些车型？这正是在稀缺条件下进行选择与配置的教科书场景。
